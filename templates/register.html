{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto card p-4">
  <h3>Register</h3>
  <form method="post">
    <div class="mb-2"><label class="form-label">Name / Organisation</label><input name="name" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">I am a</label>
      <select name="role" class="form-select"><option value="donor">Donor (restaurant, hostel, caterer)</option><option value="ngo">NGO / Receiver</option></select></div>
    <div class="mb-2"><label class="form-label">Area / Locality</label><input name="area" class="form-control" placeholder="e.g. Peelamedu" required></div>
    <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
    <button class="btn btn-success">Register</button>
  </form>
</div>
{% endblock %}
